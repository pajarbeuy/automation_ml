services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend API + ML Engine Core
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ml_autonomus_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/storage:/app/apps/api/storage
      - ./apps/api/automl.db:/app/apps/api/automl.db
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ALLOW_FILE_STORE=true
      - STORAGE_PATH=/app/apps/api/storage
    depends_on:
      - mlflow
    networks:
      - ml_network

  # ---------------------------------------------------------------------------
  # 2. React Frontend Dashboard + Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ml_autonomus_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - ml_network

  # ---------------------------------------------------------------------------
  # 3. MLflow Tracking & Model Registry Server
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: ml_autonomus_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api/storage/mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000
    networks:
      - ml_network

networks:
  ml_network:
    driver: bridge
