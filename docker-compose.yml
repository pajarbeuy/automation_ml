version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: automl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: automl
      POSTGRES_PASSWORD: automl_secret
      POSTGRES_DB: automl_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automl -d automl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: automl_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://automl:automl_secret@postgres:5432/automl_db
      STORAGE_PATH: /app/storage
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - ./apps/api:/app
      - ./packages:/app/packages
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: automl_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  storage_data:
