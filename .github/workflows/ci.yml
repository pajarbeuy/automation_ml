name: ML-Autonomus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Backend Testing & Code Quality ──────────────────────────
  backend-test:
    name: Backend Pytest & API Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-asyncio flake8 httpx PyJWT cryptography scikit-learn pandas numpy scipy

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 packages/ml_engine apps/api --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 packages/ml_engine apps/api --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Core Test Suite & API Contracts
        env:
          STORAGE_BACKEND: local
          STORAGE_PATH: ./storage
          JWT_SECRET_KEY: ci-test-secret-key-automl-2026
        run: |
          pytest tests/test_api_contracts.py \
                 tests/test_storage_adapter.py \
                 tests/test_multi_tenancy_security.py \
                 tests/test_async_jobs.py \
                 tests/test_meta_learning_ranker.py \
                 tests/test_api_new_endpoints.py \
                 tests/test_leakage_detector.py \
                 tests/test_profiling.py \
                 tests/test_recommendations.py \
                 tests/test_candidate_evaluator.py \
                 -v --tb=short

  # ─── 2. Frontend Build & Typecheck ──────────────────────────────
  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Vite Application
        run: npm run build

  # ─── 3. Docker Compose & Container Validation ───────────────────
  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate API Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: ml-autonomus-api:ci-test

      - name: Validate Web Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: apps/web/Dockerfile
          push: false
          tags: ml-autonomus-web:ci-test
